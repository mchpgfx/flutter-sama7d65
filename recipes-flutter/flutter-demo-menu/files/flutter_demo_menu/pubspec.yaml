name: flutter_demo_menu
description: Demo selector for the SAMA7D65 Curiosity. Panel-size agnostic.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

# No third-party packages: anything pulling a Linux plugin cannot build here,
# since the software backend requires disable-plugins.
dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true

# flutter_test comes from the SDK, so this needs no network and does not enter the
# release build. test/menu_layout_test.dart asserts the menu renders without overflow
# from 480x272 to 2048x2048 and that the status line reports the LIVE resolution -
# that test is what caught the stacking rule being keyed off the wrong axis.
dev_dependencies:
  flutter_test:
    sdk: flutter
